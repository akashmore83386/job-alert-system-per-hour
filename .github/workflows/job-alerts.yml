name: job-alerts

on:
  schedule:
    - cron: "*/15 * * * *" # every hour, on the hour (UTC). Use "*/15 * * * *" for every 15 min
  workflow_dispatch: # lets you run it manually from the Actions tab
    inputs:
      test:
        description: "Send a test message to Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check boards and alert
        run: node watch.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_ALERT: ${{ inputs.test && '1' || '' }}

      - name: Save seen jobs
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || (git commit -m "update seen jobs" && git push)
